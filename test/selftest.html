<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Heatpump Flow Card – self-test</title>
<!--
  Runs in a headless browser (see .github/workflows/validate.yml):
  every demo installation in every scenario, broken entity states, edge-case configs,
  preset detection (including gas boilers that must not be taken for heat pumps) and the computed values.
  Result: <pre id="result">PASS</pre> or FAIL with the failed checks.
-->
</head>
<body>
<pre id="result">RUNNING</pre>
<pre id="log"></pre>
<script src="../dist/heatpump-flow-card.js"></script>
<script src="../demo/setups.js"></script>
<script>
(async () => {
  const C = customElements.get('heatpump-flow-card');
  const fails = []; const log = []; let checks = 0;
  const check = (ok, label) => { checks++; if (!ok) fails.push(label); };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  // Same state format as the demo: value, [value, unit] or {state, attributes}.
  const toStates = (obj) => {
    const out = {};
    for (const [k, v] of Object.entries(obj)) {
      if (v && typeof v === 'object' && !Array.isArray(v)) { out[k] = { entity_id: k, attributes: {}, ...v }; continue; }
      const [state, unit] = Array.isArray(v) ? v : [v];
      out[k] = { entity_id: k, state, attributes: unit ? { unit_of_measurement: unit } : {} };
    }
    return out;
  };
  const hassOf = (states, registry = {}, energy, setup = {}) => ({
    states, entities: registry, locale: { language: 'en' }, language: 'en',
    callWS: (m) => (m.type === 'recorder/statistic_during_period' ? statChange(setup, m)
      : m.type === 'history/history_during_period' && setup.states ? historySim(setup, m)
      : m.type === 'energy/get_prefs' && energy ? Promise.resolve(energy) : Promise.reject(new Error('n/a'))),
    callService: () => Promise.resolve(),
  });
  const mount = (config, hass) => {
    C._energyPrefs = null;
    const card = document.createElement('heatpump-flow-card');
    card.setConfig(config);
    document.body.appendChild(card);
    card.hass = hass; card.hass = { ...hass };
    return card;
  };
  const ok = (card) => !card._failed && !!card.shadowRoot.getElementById('svg');

  // 1. every installation and scenario renders, presets are detected
  for (const [i, s] of setups.entries()) {
    for (const [scen] of scenarios) {
      const card = mount(s.config, hassOf(toStates(s.states(scen)), s.registry || {}, s.energy, s));
      await wait(5);
      check(ok(card), `render ${i}/${scen}`);
      check(card.shadowRoot.getElementById('chip-mode')?.textContent.trim().length > 0, `mode chip ${i}/${scen}`);
      if (s.config.preset) check(!card._needsBuild, `preset detected ${i}/${scen}`);
      card.remove();
    }
  }

  // 2. broken states never break the card
  const variants = ['unavailable', 'unknown', '', 'abc', '-999', '1e9', 'NaN'];
  for (const [i, s] of setups.entries()) {
    const base = toStates(s.states('heat'));
    for (const v of variants) {
      const broken = {}; for (const [k, o] of Object.entries(base)) broken[k] = { ...o, state: v, attributes: v === '' ? {} : o.attributes };
      const card = mount(s.config, hassOf(broken, s.registry || {}));
      check(ok(card), `broken state "${v}" in setup ${i}`);
      card.remove();
    }
  }

  // 3. edge-case configs
  const edge = [{}, { preset: 'none' }, { entities: { flow: 'sensor.nope', power: 'sensor.nope2' } }, { hc_count: 3, hc2_type: 'radiator' },
    { hc_count: '7' }, { controls: ['switch.nope', { entity: 'select.nope' }, null, 5] }, { details: ['sensor.nope', null] },
    { badges: [{ entity: 'x' }] }, { stats: [{ entity: 'sensor.nope' }] }, { source_type: 'brine' },
    { source_type: 'water', entities: { heater: 'sensor.h', dhw_heater: 'sensor.d' } }, { preset: 'lambda' },
    { tiles: [null, {}, 'spread', { entity: 'sensor.nope' }] }, { preset: 'lambda', tiles: ['cop_heating:year', 'load_classes', 'cost'] }];
  for (const cfg of edge) { const card = mount(cfg, hassOf(toStates({ 'sensor.h': '7', 'sensor.d': 'weird' }))); check(ok(card), `edge config ${JSON.stringify(cfg)}`); card.remove(); }

  // 4. invalid configs give a readable error
  for (const cfg of [{ preset: 'foo' }, { hc_type: 'x' }, { source_type: 'lava' }, null, { tiles: ['nope'] }, { tiles: ['cop_heating:fortnight'] }, { tiles: 'cop_heating' },
    { price: { v: 1 } }, { tiles: [{ key: 'spread', tap_action: 'navigate' }] }, { stats: [{ entity: 'sensor.x', hold_action: true }] },
    { layout: 'huge' }, { actions: [] }, { actions: { mode: 'navigate' } }, { actions: { mode: { tap_action: 'navigate' } } },
    { badges: [{ entity: 'sensor.x', hold_action: 'toggle' }] },
    { program_map: [] }, { program_map: 'eco' }, { compressor_speed_max: 0 }, { compressor_speed_max: 'fast' },
    { timeline: 'yes' }, { timeline_hours: 0 }, { wall_timeout: -1 }, { wall_timeout: 'soon' }, { unit_style: 'tesla' }, { unit_size: 'huge' }]) {
    let threw = false; try { new C().setConfig(cfg); } catch (e) { threw = true; }
    check(threw, `invalid config rejected ${JSON.stringify(cfg)}`);
  }

  // 5. detection: the right preset for each installation, nothing for gas boilers or foreign entities
  const stub = (states, registry) => C.getStubConfig(hassOf(toStates(states), registry));
  const expect = { 0: 'lambda', 1: 'lambda', 2: 'vicare', 3: 'vaillant', 4: 'emsesp', 5: 'heishamon', 6: 'emsesp', 7: 'samsung' };
  for (const [i, p] of Object.entries(expect)) {
    const s = setups[i]; const st = stub(s.states('heat'), s.registry || {});
    check(st.preset === p, `stub preset ${i} = ${p} (got ${st.preset})`);
    if (+i === 6) { check(st.source_type === 'brine', 'stub source_type brine'); check(st.hc_count === 2, `stub hc_count 2 (got ${st.hc_count})`); }
  }
  const detects = (preset, states, registry) => HFC_PRESETS[preset].detect(C._ctx(hassOf(toStates(states), registry), undefined, { hp: 1, dhw: 1, buffer: 1, hc: 1 })) !== undefined;
  check(!detects('emsesp', { 'sensor.boiler_curflowtemp': '45', 'sensor.boiler_outdoortemp': '5' }, { 'sensor.boiler_curflowtemp': { platform: 'mqtt' } }), 'EMS-ESP gas boiler is not a heat pump');
  check(!detects('vicare', { 'sensor.vitodens_outside_temperature': '5', 'sensor.vitodens_boiler_temperature': '60' },
    { 'sensor.vitodens_outside_temperature': { platform: 'vicare', translation_key: 'outside_temperature' } }), 'ViCare gas boiler is not a heat pump');
  check(!detects('lambda', { 'sensor.other_hp1_operating_state': 'x' }, { 'sensor.other_hp1_operating_state': { platform: 'something_else' } }), 'foreign hp1_operating_state is not Lambda');
  check(!detects('samsung', { 'sensor.boiler_3_way_valve': 'Room' }, { 'sensor.boiler_3_way_valve': { platform: 'esphome' } }), 'a 3-way valve without the Samsung error code is not Samsung');

  // 6. computed values
  {
    const s = setups[1];
    const card = mount(s.config, hassOf(toStates(s.states('heat')), {}, s.energy));
    await wait(20);
    const txt = (id) => card.shadowRoot.getElementById(id)?.textContent || '';
    check(card._powerMode() === 'energy', 'Energy dashboard mode');
    check(/1,094/.test(txt('t-src-pv-v')) && /146/.test(txt('t-src-grid-v')), `Energy dashboard split (${txt('t-src-pv-v')} / ${txt('t-src-grid-v')})`);
    card.remove();
  }
  {
    const s = setups[0];
    const card = mount(s.config, hassOf(toStates(s.states('heat'))));
    const rows = Object.fromEntries([...card.shadowRoot.querySelectorAll('.drow')].map((r) => [r.querySelector('span').textContent, r.querySelector('b').textContent]));
    check(rows.Superheat === '4.8 K', `superheat (${rows.Superheat})`);
    check(rows['COP total'] === '≈4.55', `total COP (${rows['COP total']})`);
    card._hass.states['sensor.eu08l_hp1_compressor_power_consumption_accumulated'] = { entity_id: 'x', state: '211072', attributes: { unit_of_measurement: 'Wh' } };
    check(card._fmtState('energy_total') === '211 kWh', `Wh shown as kWh (${card._fmtState('energy_total')})`);
    card.remove();
  }

  // 7. an unexpected error shows a message instead of an empty card
  {
    const s = setups[0];
    const card = mount(s.config, hassOf(toStates(s.states('heat'))));
    card._update = () => { throw new Error('boom'); };
    const orig = console.error; console.error = () => {};
    card.hass = { ...card._hass };
    console.error = orig;
    check(card._failed && /boom/.test(card.shadowRoot.textContent), 'error boundary shows a message');
    card.remove();
  }

  // 8. stat tile catalog: order, periods, statistics fallback, computed values, free entities, editor options
  const tileRows = (card) => [...card.shadowRoot.querySelectorAll('#stats .stat')].map((t) => [t.querySelector('.sl').textContent, t.querySelector('.sv').textContent]);
  const tilesOf = async (s, tiles, scen = 'heat', withStats = true) => {
    const card = mount({ ...s.config, tiles }, hassOf(toStates(s.states(scen)), s.registry || {}, null, withStats ? s : {}));
    await wait(20);
    const rows = tileRows(card); card.remove();
    return { rows, t: Object.fromEntries(rows) };
  };
  {
    const s = setups[0];
    const { rows, t } = await tilesOf(s, s.config.tiles);
    check(rows.length === 7 && rows[0][0] === 'COP heating · today' && rows[6][0] === 'Electricity heating · week', `Lambda tile order (${rows.map((r) => r[0]).join(' | ')})`);
    check(t['COP heating · today'] === '5.05', `legacy entity as today (${t['COP heating · today']})`);
    check(t['COP heating · month'] === '4.62', `preset period entity (${t['COP heating · month']})`);
    check(t['Electricity · today'] === '5.1 kWh · 24 % PV', `energy with PV share (${t['Electricity · today']})`);
    check(t['Defrosts · yesterday'] === '4', 'Lambda defrost tile');
    const small = (await tilesOf(s, ['energy_standby'])).t;
    check(small['Standby · today'] === '0.12 kWh', `small energy keeps two decimals (${small['Standby · today']})`);
    check(t['Electricity heating · week'] === '61.3 kWh', `week from statistics (${t['Electricity heating · week']})`);
    const more = (await tilesOf(s, ['heat_heating', 'cop_total', 'energy_aux', { key: 'cost', period: 'today', price: 0.3 }, { entity: 'sensor.heating_curve_flow', name: 'Curve' },
      { key: 'energy', entity: 'sensor.heatpump_energy_today', name: 'Mine' }, 'spread', 'outdoor', { key: 'cop_heating', period: 'month', name: 'Monthly', decimals: 1 }])).t;
    check(more['Heat heating · today'] === '20.4 kWh', 'Lambda heat tile');
    check(more['COP total · total'] === '≈4.55', `cop_total computed from totals (${more['COP total · total']})`);
    check(!Object.keys(more).some((k) => k.startsWith('Electricity heater')), 'unavailable tile hidden');
    check(/1\.53/.test(more['Cost · today'] || ''), `cost tile (${more['Cost · today']})`);
    check(more.Curve === '33.5 °C' && more.Mine === '5.1 kWh', `free entity tiles (${more.Curve} / ${more.Mine})`);
    check(more.Spread === '4.5 K' && more.Outdoor === '10.4 °C', `live tiles (${more.Spread} / ${more.Outdoor})`);
    check(more.Monthly === '4.6', `name and decimals override (${more.Monthly})`);
  }
  {
    const s = setups[4];
    const { t } = await tilesOf(s, s.config.tiles);
    check(t['COP heating · today'] === '≈4.05', `EMS-ESP COP from statistics (${t['COP heating · today']})`);
    check(t['Electricity heating · today'] === '9.6 kWh', 'EMS-ESP energy today');
    check(t['COP heating · month'] === '≈3.86', `EMS-ESP COP month (${t['COP heating · month']})`);
    check(t['Compressor starts · today'] === '4', `starts from statistics (${t['Compressor starts · today']})`);
    check(t['Runtime per start · today'] === '≈2.5 h', `runtime per start, minutes to hours (${t['Runtime per start · today']})`);
    check(t.Spread === '5.5 K' && t['Heat output'] === '≈6.9 kW', `EMS-ESP live tiles (${t.Spread} / ${t['Heat output']})`);
    const cal = (await tilesOf(s, ['energy_heating:yesterday', 'starts:week', 'cop_heating:year', 'spf'])).t;
    check(cal['Electricity heating · yesterday'] === '12.1 kWh' && cal['Compressor starts · week'] === '31', `statistics yesterday and week (${JSON.stringify(cal)})`);
    check(cal['COP heating · year'] === '≈4.03' && !('SPF (year)' in cal), 'COP year; no SPF without total counters');
    const none = (await tilesOf(s, ['energy_heating', 'energy_heating:total'], 'heat', false)).t;
    check(none['Electricity heating · today'] === '–' && none['Electricity heating · total'] === '4,211 kWh', `missing statistics show a dash (${JSON.stringify(none)})`);
  }
  {
    const hm = (await tilesOf(setups[5], ['cop_heating', 'energy_heating'])).t;
    check(hm['COP heating · now'] === '≈4.32' && hm['Electricity heating · now'] === '1,250 W', `HeishaMon COP now (${JSON.stringify(hm)})`);
    const vi = (await tilesOf(setups[2], ['cop_heating', 'starts', 'energy'])).t;
    check(vi['COP heating · total'] === '3.90' && vi['Compressor starts · total'] === '4,123' && vi['Electricity · today'] === '8.4 kWh', `ViCare periods (${JSON.stringify(vi)})`);
    const card = mount({ ...setups[0].config, tiles: [] }, hassOf(toStates(setups[0].states('heat'))));
    check(card.shadowRoot.getElementById('stats').style.display === 'none', 'tiles: [] hides the row');
    card.remove();
    const def = tileRows(mount(setups[1].config, hassOf(toStates(setups[1].states('heat')))));
    check(def[0] && def[0][0] === 'COP heating today', `default tiles unchanged without tiles (${def[0] && def[0][0]})`);
    document.querySelectorAll('heatpump-flow-card').forEach((c) => c.remove());
  }
  {
    const s = setups[0];
    const hass = hassOf(toStates(s.states('heat')), {}, null, s);
    const o = C._tileOptions(s.config, C._resolve(s.config, hass), hass);
    const vals = o.options.map((x) => x.value);
    check(o.editable && ['cop_heating:month', 'energy_heating:week', 'spread', 'cop_total'].every((v) => vals.includes(v)), `editor options (${vals.join(',')})`);
    check(!vals.includes('energy_aux') && !vals.some((v) => v.startsWith('cost')), 'editor offers only fillable tiles');
    check(o.value[0] === 'cop_heating:today' && o.defaults.includes('spread'), `editor value and defaults (${o.value[0]} / ${o.defaults.join(',')})`);
    check(!C._tileOptions({ ...s.config, tiles: [{ key: 'spread', name: 'x' }] }, C._resolve(s.config, hass), hass).editable, 'own tile options are YAML only');
    const ed = document.createElement('heatpump-flow-card-editor');
    let out;
    ed.addEventListener('config-changed', (ev) => { out = ev.detail.config; });
    ed.setConfig({ preset: 'lambda' }); ed.hass = hass;
    ed._changed({ preset: 'lambda', tiles_custom: true });
    check(Array.isArray(out.tiles) && out.tiles.includes('cop_heating:today') && !('tiles_custom' in out), `editor switches tiles on (${JSON.stringify(out.tiles)})`);
    ed._changed({ ...out, tiles_custom: true, tiles: ['spread', 'cop_heating:month'] });
    check(JSON.stringify(out.tiles) === '["spread","cop_heating:month"]', 'editor writes the selection in order');
    ed._changed({ ...out, tiles_custom: false });
    check(!('tiles' in out), 'editor switches back to the default tiles');
  }

  // 9. cost tile (fixed price, dynamic tariff billed per hour) and tile actions
  {
    const s = setups[4];
    const ems = 'sensor.ems_esp_boiler_nrgconstotal';
    const t0 = Date.UTC(2026, 9, 21, 0); const H = 3600000;
    let sent = null;
    const costHass = (price, extra = {}) => {
      const states = toStates({ ...s.states('heat'), [ems]: { state: '5000', attributes: { unit_of_measurement: 'kWh', state_class: 'total_increasing' } }, 'sensor.epex': price, ...extra });
      const h = hassOf(states, s.registry || {}, null, s);
      h.config = { time_zone: 'Europe/Vienna', currency: 'EUR' };
      h.callWS = (m) => {
        if (m.type === 'recorder/statistic_during_period') {
          const v = m.statistic_id === ems ? { day: 10, year: 3000 }[m.calendar.period] : emsStatistics[m.statistic_id]?.[m.calendar.period === 'day' ? 'today' : m.calendar.period];
          return v === undefined ? Promise.reject(new Error('none')) : Promise.resolve({ change: v });
        }
        if (m.type === 'recorder/statistics_during_period') {
          sent = m;
          // Two compiled hours: 4 kWh at 20 ct, 5 kWh at 30 ct; the remaining 1 kWh of today is billed at the current 25 ct.
          return Promise.resolve({ [ems]: [{ start: t0, end: t0 + H, change: 4 }, { start: t0 + H, end: t0 + 2 * H, change: 5 }],
            'sensor.epex': [{ start: t0, end: t0 + H, mean: 20 }, { start: t0 + H, end: t0 + 2 * H, mean: 30 }] });
        }
        return Promise.reject(new Error('n/a'));
      };
      return h;
    };
    const costOf = async (cfg, hass) => {
      const card = mount({ ...s.config, ...cfg }, hass);
      await wait(30);
      const t = Object.fromEntries(tileRows(card)); card.remove();
      return t;
    };
    const fixed = await costOf({ price: 0.3, tiles: ['cost'] }, costHass('25'));
    check(fixed['Cost · today'] === '€3.00', `fixed global price (${fixed['Cost · today']})`);
    const dyn = await costOf({ price: 'sensor.epex', tiles: ['cost', 'cost:year'] }, costHass({ state: '25', attributes: { unit_of_measurement: 'ct/kWh', state_class: 'measurement' } }));
    check(dyn['Cost · today'] === '€2.55', `dynamic tariff billed per hour (${dyn['Cost · today']})`);
    check(sent && sent.statistic_ids.includes(ems) && sent.statistic_ids.includes('sensor.epex') && sent.units.energy === 'kWh' && sent.types.includes('mean'), `hourly statistics query (${JSON.stringify(sent)})`);
    check(/^≈€/.test(dyn['Cost · year'] || ''), `year cost from daily statistics is approximate (${dyn['Cost · year']})`);
    const plain = await costOf({ price: 'sensor.epex', tiles: ['cost'] }, costHass(['0.25', 'EUR/kWh']));
    check(plain['Cost · today'] === '≈€2.50', `price entity without statistics: current price (${plain['Cost · today']})`);
    const mwh = await costOf({ tiles: [{ key: 'cost', price: 'sensor.epex' }] }, costHass(['250', 'EUR/MWh']));
    check(mwh['Cost · today'] === '≈€2.50', `per-MWh price converted (${mwh['Cost · today']})`);
    const noPrice = await costOf({ tiles: ['cost', 'spread'] }, costHass('25'));
    check(!('Cost · today' in noPrice) || noPrice['Cost · today'] === '–', 'cost without a price shows no value');

    // calendar periods in the Home Assistant time zone
    const probe = Object.assign(Object.create(C.prototype), { _hass: { config: { time_zone: 'Europe/Vienna' } } });
    const wall = (iso, tz) => new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', weekday: 'short', day: 'numeric', hour: 'numeric', minute: 'numeric' }).format(new Date(iso));
    const [today, , g] = probe._periodRange('today');
    check(/, 00:00$/.test(wall(today, 'Europe/Vienna')) && g === 'hour', `today starts at local midnight (${today} = ${wall(today, 'Europe/Vienna')})`);
    const [week] = probe._periodRange('week');
    check(/Mon, 00:00$/.test(wall(week, 'Europe/Vienna')), `week starts on Monday (${wall(week, 'Europe/Vienna')})`);
    const [ys, ye] = probe._periodRange('yesterday');
    check(ye === today && (Date.parse(ye) - Date.parse(ys)) / H >= 23 && (Date.parse(ye) - Date.parse(ys)) / H <= 25, 'yesterday ends at the start of today');
    probe._hass = { config: { time_zone: 'America/New_York' } };
    const [ny] = probe._periodRange('month');
    check(/^1, 00:00$/.test(new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hourCycle: 'h23', day: 'numeric', hour: 'numeric', minute: 'numeric' }).format(new Date(ny))), `month start in another time zone (${ny})`);
    probe._hass = { config: { time_zone: 'Not/AZone' } };
    check(!!probe._periodRange('today'), 'unknown time zone falls back to the browser');

    // editor: global price enables the cost tile
    const hass = costHass('25');
    const o = C._tileOptions({ ...s.config, price: 0.3 }, C._resolve(s.config, hass), hass).options.map((x) => x.value);
    check(o.includes('cost:month') && o.includes('cost:today') && !o.includes('cost:now'), `editor offers cost with a price (${o.filter((v) => v.startsWith('cost')).join(',')})`);
    const ed = document.createElement('heatpump-flow-card-editor');
    let out;
    ed.addEventListener('config-changed', (ev) => { out = ev.detail.config; });
    ed.setConfig({ preset: 'emsesp', tiles: ['spread'] }); ed.hass = hass;
    ed._changed({ preset: 'emsesp', tiles_custom: true, tiles: ['spread'], price_fixed: 0.31 });
    check(out.price === 0.31 && !('price_fixed' in out) && !('price_entity' in out), `editor writes a fixed price (${JSON.stringify(out)})`);
    ed._changed({ ...out, tiles_custom: true, price_fixed: 0.31, price_entity: 'sensor.epex' });
    check(out.price === 'sensor.epex', 'editor prefers the price entity');
    ed._changed({ ...out, tiles_custom: true, price_fixed: undefined, price_entity: undefined });
    check(!('price' in out), 'editor clears the price');
  }
  {
    const s = setups[0];
    const card = mount({ ...s.config, tiles: [{ key: 'spread', tap_action: { action: 'navigate', navigation_path: '/energy' } }, 'outdoor',
      { key: 'cop_heating', hold_action: { action: 'more-info' }, double_tap_action: { action: 'navigate', navigation_path: '/history' } }, { key: 'starts', tap_action: { action: 'none' } }] },
    hassOf(toStates(s.states('heat'))));
    await wait(20);
    const ev = [];
    card.addEventListener('hass-action', (e) => ev.push(['action', e.detail.action, e.detail.config]));
    card.addEventListener('hass-more-info', (e) => ev.push(['more-info', e.detail.entityId]));
    const tile = (n) => card.shadowRoot.querySelector(`#stats .stat[data-tile="${n}"]`);
    tile(0).click();
    check(ev.length === 1 && ev[0][1] === 'tap' && ev[0][2].tap_action.navigation_path === '/energy' && /flow/.test(ev[0][2].entity), `tap_action goes to hass-action (${JSON.stringify(ev)})`);
    ev.length = 0; tile(1).click();
    check(ev.length === 1 && ev[0][0] === 'more-info' && /outdoor|outside|ambient/.test(ev[0][1]), `default tap opens more-info (${JSON.stringify(ev)})`);
    ev.length = 0; tile(3).click();
    check(ev.length === 0, 'action none does nothing');
    ev.length = 0;
    tile(2).dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, composed: true }));
    await wait(600);
    tile(2).dispatchEvent(new PointerEvent('pointerup', { bubbles: true, composed: true }));
    tile(2).click();
    await wait(300);
    check(ev.length === 1 && ev[0][1] === 'hold', `hold_action after 500 ms, no tap afterwards (${JSON.stringify(ev)})`);
    ev.length = 0; tile(2).click(); tile(2).click();
    await wait(300);
    check(ev.length === 1 && ev[0][1] === 'double_tap' && ev[0][2].double_tap_action.navigation_path === '/history', `double_tap_action (${JSON.stringify(ev)})`);
    ev.length = 0; tile(2).click();
    check(ev.length === 0, 'single tap waits for a possible double tap');
    await wait(300);
    check(ev.length === 1 && ev[0][0] === 'more-info', `then falls back to more-info (${JSON.stringify(ev)})`);

  // 10. theming through --hfc-* variables, layouts, actions on every element of the schematic

  // 11. animation speed, heating program chip, solar thermal
  {
    const s = setups[0];
    const hassWith = (setup, scen, extra = {}, reg = {}) => hassOf(toStates({ ...setup.states(scen), ...extra }), { ...(setup.registry || {}), ...reg }, null, setup);
    const rating = 'sensor.eu08l_hp1_compressor_unit_rating';
    const fanOf = async (extra, cfg = {}) => {
      const c = mount({ ...s.config, ...cfg }, hassWith(s, 'heat', extra)); await wait(20);
      const r = [c.style.getPropertyValue('--hfc-fan'), c.style.getPropertyValue('--hfc-pump')]; c.remove(); return r;
    };
    let r = await fanOf({});
    check(r[0] === '1.53s' && r[1] === '1.25s', `fan and pump follow the compressor modulation of 46 % (${r})`);
    r = await fanOf({ [rating]: ['100', '%'] });
    check(r[0] === '0.50s' && r[1] === '0.60s', `full speed: fastest (${r})`);
    r = await fanOf({ [rating]: ['50', '%'] });
    check(r[0] === '1.45s', `half speed (${r})`);
    r = await fanOf({ [rating]: 'unknown' });
    check(r[0] === '1.57s' && r[1] === '1.20s', `without a modulation value the fan follows the power, the pump keeps its pace (${r})`);
    r = await fanOf({ [rating]: ['60', 'Hz'] }, { compressor_speed_max: 120 });
    check(r[0] === '1.45s', `Hz against compressor_speed_max (${r})`);

    // heating program chip
    const prog = async (setup, scen, extra, cfg = {}) => {
      const c = mount({ ...setup.config, ...cfg }, hassWith(setup, scen, extra)); await wait(20);
      const chip = c.shadowRoot.getElementById('chip-program');
      const out = [chip.classList.contains('on') ? [...chip.classList].find((x) => HFC_KINDS.includes(x)) : '', chip.textContent.trim()]; c.remove(); return out;
    };
    const HFC_KINDS = ['eco', 'night', 'party', 'holiday'];
    for (const [scen, kind, label] of [['heat', 'eco', 'Eco'], ['dhw', 'party', 'Party'], ['defrost', 'night', 'Night'], ['idle', 'holiday', 'Holiday']]) {
      const p = await prog(s, scen);
      check(p[0] === kind && p[1] === label, `program chip ${scen}: ${kind} (${p})`);
    }
    check((await prog(s, 'heat', { 'select.heatpump_heating_program': 'Comfort' }))[0] === '', 'comfort shows no chip');
    check((await prog(s, 'heat', { 'select.heatpump_heating_program': 'Reduziert' }))[0] === 'night', 'German "reduziert" is night');
    check((await prog(s, 'heat', { 'select.heatpump_heating_program': 'Comfort' }, { program_map: { Comfort: 'party' } }))[0] === 'party', 'program_map maps a raw state');
    check((await prog(s, 'heat', {}, { program_map: { Eco: 'none' } }))[0] === '', 'program_map none hides the chip');
    const noProgram = { ...s.config, entities: { ...s.config.entities, program: null } };
    check((await prog({ ...s, config: noProgram }, 'heat', { 'sensor.eu08l_hc1_operating_state': 'ECO' }))[0] === 'eco', 'without a program entity the circuit mode ECO shows eco');
    check((await prog({ ...s, config: noProgram }, 'heat', {}))[0] === '', 'circuit mode HEATING shows no chip');
    const hm = setups[5];
    check((await prog(hm, 'heat', { 'sensor.panasonic_heat_pump_main_holiday_mode_state': 'Active' }))[0] === 'holiday', 'HeishaMon holiday mode Active');
    check((await prog(hm, 'heat', { 'sensor.panasonic_heat_pump_main_holiday_mode_state': 'Scheduled' }))[0] === '', 'HeishaMon holiday mode Scheduled shows nothing');
    {
      const c = mount(s.config, hassWith(s, 'heat')); await wait(20);
      const ev = []; c.addEventListener('hass-more-info', (e) => ev.push(e.detail.entityId));

    // solar thermal
    const sol = async (scen, cfg = {}, setup = s, extra = {}, reg = {}) => {
      const c = mount({ ...setup.config, ...cfg }, hassWith(setup, scen, extra, reg)); await wait(20);

    o = await sol('defrost');
    check(o.has && o.text === '12.5 °C' && !o.flow && !o.coil && !o.panel, `solar loop idle with the pump off (${JSON.stringify(o)})`);
    o = await sol('heat', { entities: { ...s.config.entities, solar_collector: null } });
    check(o.has && o.text === 'Solar' && o.flow, `pump only: label without a temperature (${JSON.stringify(o)})`);
    o = await sol('heat', { entities: { ...s.config.entities, dhw_top: null, dhw_mode: null } });

    o = await sol('heat', { entities: { ...s.config.entities, solar_collector: null, solar_pump: null } });
    check(!o.has && o.ok, 'no solar loop without solar entities');

    o = await sol('heat', {}, vi, { 'sensor.vitocal_kollektor': ['63.0', '°C'], 'binary_sensor.vitocal_solarpumpe': 'on' },

    check(o.has && o.text === '63.0 °C' && o.flow, `ViCare preset finds the solar collector and pump (${JSON.stringify(o)})`);
    const keys = (n) => (n.schema ? n.schema.flatMap(keys) : [n.name]);

    check(['program', 'solar_collector', 'solar_pump'].every((k) => formKeys.includes(k)), 'editor offers program and solar entities');

  // 12. wall display: large type, controls appear on touch and fade out

  // 13. appearance: narrow schematics, chip contrast, source labels, tank scale, idle pipes, bridge at crossing risers
  {

    check(stops('#stats .stat').length === 1 && [...sr.querySelectorAll('#stats .stat')].every((e) => e.getAttribute('role') === 'button'), 'the tiles are a single tab stop');
    check(stops('#drawer-body .drow').length === 1, 'the details are a single tab stop');
    check([...sr.querySelectorAll('.head [data-entity]')].filter((e) => getComputedStyle(e).display !== 'none').every((e) => e.getAttribute('tabindex') === '0' && e.getAttribute('role') === 'button'), 'header chips are tab stops');
    check(sr.getElementById('svg').getAttribute('role') === 'group', 'the schematic is a group, not an image');
    const flow = sr.querySelector(`#svg [data-entity="${c._e.flow}"]`);
    check(/32\.4/.test(flow.getAttribute('aria-label') || ''), `schematic parts carry a label with the value (${flow.getAttribute('aria-label')})`);
    // arrow keys move through the schematic, the focused part becomes the tab stop, a frame is drawn
    const first = stops('#svg [data-entity]')[0];
    first.focus();
    const key = (el, k, mods = {}) => el.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, composed: true, cancelable: true, ...mods }));
    key(first, 'ArrowRight');
    const second = sr.activeElement;
    check(second && second !== first && svgItems.includes(second), 'ArrowRight moves the focus to the next part');
    check(stops('#svg [data-entity]').length === 1 && stops('#svg [data-entity]')[0] === second && first.getAttribute('tabindex') === '-1', 'the focused part is the only tab stop');
    check(sr.querySelectorAll('.focus-ring').length === 1 && sr.querySelector('.focus-ring').parentNode === second, 'a focus frame sits in the focused part');
    key(second, 'ArrowLeft');
    check(sr.activeElement === first, 'ArrowLeft goes back');
    key(first, 'End'); check(sr.activeElement === svgItems[svgItems.length - 1], 'End goes to the last part');
    key(sr.activeElement, 'Home'); check(sr.activeElement === svgItems[0], 'Home goes to the first part');
    sr.activeElement.blur();
    check(sr.querySelectorAll('.focus-ring').length === 0, 'the frame disappears when the focus leaves');
    // activation: Enter and Space tap, Shift+Enter holds, Alt+Enter double taps
    const ev = [];
    c.addEventListener('hass-action', (e) => ev.push(['action', e.detail.action, e.detail.config]));
    c.addEventListener('hass-more-info', (e) => ev.push(['more-info', e.detail.entityId]));
    const dhw = sr.querySelector(`#svg [data-entity="${c._e.dhw_top}"]`);
    key(dhw, 'Enter');
    check(ev.length === 1 && ev[0][1] === 'tap' && ev[0][2].tap_action.navigation_path === '/dhw', `Enter runs tap_action (${JSON.stringify(ev)})`);
    ev.length = 0; key(dhw, ' ');
    check(ev.length === 1 && ev[0][1] === 'tap', 'Space runs tap_action');
    ev.length = 0; key(dhw, 'Enter', { shiftKey: true });
    check(ev.length === 1 && ev[0][1] === 'hold', 'Shift+Enter runs hold_action');
    ev.length = 0; key(dhw, 'Enter', { altKey: true });
    check(ev.length === 1 && ev[0][1] === 'double_tap' && ev[0][2].double_tap_action.url_path === 'https://example.org', 'Alt+Enter runs double_tap_action');
    ev.length = 0; key(flow, 'Enter');
    check(ev.length === 1 && ev[0][0] === 'more-info' && ev[0][1] === c._e.flow, 'Enter without configured actions opens more-info');
    ev.length = 0; key(flow, 'Enter', { shiftKey: true }); key(flow, 'a');
    check(ev.length === 0, 'unconfigured hold and other keys do nothing');
    ev.length = 0; key(sr.querySelector('#stats .stat'), 'Enter');
    check(ev.length === 1 && ev[0][0] === 'more-info', 'Enter on a tile opens more-info');
    ev.length = 0; key(sr.getElementById('chip-mode'), 'Enter');
    check(ev.length === 1 && ev[0][0] === 'more-info', 'Enter on a header chip opens more-info');
    // a tile keeps the focus when its values are drawn again
    const tile = sr.querySelector('#stats .stat'); tile.focus();
    const st2 = toStates({ ...s.states('heat'), 'sensor.eu08l_hp1_heating_cop_daily': '4.44' });
    c.hass = { ...hass, states: st2 }; await wait(30);
    check(sr.activeElement && sr.activeElement.classList.contains('stat'), 'a focused tile stays focused when values change');
    c.remove();
  }

  // 16. heat pump block: frame colour by mode, outdoor temperature at the unit, long status lines wrap
  {
    const s = setups[0];
    const mk = async (scen, extra = {}, cfg = {}, setup = s) => {
      const c = mount({ ...setup.config, ...cfg }, hassOf(toStates({ ...setup.states(scen), ...extra }), setup.registry || {}, setup.energy, setup)); await wait(25);
      return c;
    };
    const tone = async (scen) => { const c = await mk(scen); const b = c.shadowRoot.getElementById('hp-box'); const out = [b.classList.contains('on'), ['dhw', 'defrost', 'cool'].filter((x) => b.classList.contains(x)).join(), getComputedStyle(b).stroke]; c.remove(); return out; };
    let r = await tone('heat');
    check(r[0] && r[1] === '', `heating: orange frame (${r})`);
    r = await tone('dhw');
    check(r[0] && r[1] === 'dhw', `hot water: red frame (${r})`);
    r = await tone('defrost');
    check(r[0] && r[1] === 'defrost', `defrost: blue frame (${r})`);
    r = await tone('idle');
    check(!r[0] && r[1] === '', `standby: no coloured frame (${r})`);
    // outdoor temperature sits under the unit for air sources, in the house otherwise
    let c = await mk('heat');
    check(/10\.4/.test(c.shadowRoot.getElementById('t-outdoor-hp')?.textContent || '') && !c.shadowRoot.getElementById('t-outdoor'), 'air source: outdoor temperature under the heat pump, not in the house');
    check(/9\.8/.test(c.shadowRoot.getElementById('t-src-in').textContent), 'the air inlet label is still there');
    check(c.shadowRoot.getElementById('t-outdoor-hp').getAttribute('y') === '472', 'outdoor line sits below the air inlet line');
    c.remove();
    c = await mk('heat', {}, {}, setups[3]);
    check(c.shadowRoot.getElementById('t-src-in').textContent === '' && c.shadowRoot.getElementById('t-outdoor-hp').getAttribute('y') === '450', 'without an air inlet line the outdoor line moves up');
    c.remove();
    c = await mk('heat', {}, {}, setups[6]);
    check(!c.shadowRoot.getElementById('t-outdoor-hp') && /6\.5/.test(c.shadowRoot.getElementById('t-outdoor')?.textContent || ''), 'ground source: outdoor temperature stays in the house');
    c.remove();
    // status line
    const status = async (extra, cfg) => {
      const k = await mk('dhw', extra, cfg); const el = k.shadowRoot.getElementById('t-hp-status');
      const out = { spans: el.querySelectorAll('tspan').length, text: el.textContent, y: el.getAttribute('y'), py: k.shadowRoot.getElementById('t-hp-power').getAttribute('y') }; k.remove(); return out;
    };
    let st = await status({});
    check(st.spans === 0 && st.y === '366' && st.py === '390', `short status stays on one line (${JSON.stringify(st)})`);
    st = await status({ 'sensor.eu08l_hp1_state': 'START COMPRESSOR' }, { language: 'de' });
    check(st.spans === 2 && st.y === '362' && st.py === '397' && st.text.startsWith('Warmwasser') && /Verdichter startet/.test(st.text), `long German status wraps at the separator (${JSON.stringify(st)})`);
    st = await status({ 'sensor.eu08l_hp1_state': 'START COMPRESSOR' }, { language: 'en' });
    check(st.spans === 2 && /starting compressor/.test(st.text), `long English status wraps (${JSON.stringify(st)})`);
    st = await status({ 'sensor.eu08l_hp1_state': 'REGULATION' }, { language: 'de' });
    check(st.spans === 0 && st.y === '366', 'a status that fits is not wrapped');
  }

  // 17. unique element names: the card is reachable as heatpump-hydraulic-card, also when another card owns the generic names
  {
    const s = setups[0];
    const alias = customElements.get('heatpump-hydraulic-card');
    check(!!alias && alias.prototype instanceof C && alias.hfcOwner === 'sturmi77', 'the card is also registered as heatpump-hydraulic-card');
    check(!!customElements.get('heatpump-hydraulic-card-editor') && customElements.get('heatpump-hydraulic-card-editor').hfcOwner === 'sturmi77', 'the editor is registered under the unique name');
    check(alias.getConfigElement().localName === 'heatpump-hydraulic-card-editor' && C.getConfigElement().localName === 'heatpump-flow-card-editor', 'each card opens its own editor');
    const a = document.createElement('heatpump-hydraulic-card');
    a.setConfig(s.config); document.body.appendChild(a);
    const h = hassOf(toStates(s.states('heat')), s.registry || {}, null, s);
    a.hass = h; a.hass = { ...h };
    await wait(30);
    check(ok(a) && !!a.shadowRoot.querySelector('.lam-body'), 'the alias renders the same card');
    a.remove();
    check(window.customCards.filter((c) => /^heatpump-(flow|hydraulic)-card$/.test(c.type)).length === 1 && window.customCards.some((c) => c.type === 'heatpump-flow-card'), 'the card picker lists the card once, under the generic name');
    // another card got the generic names first (iframe with a stand-in)
    const fr = document.createElement('iframe');
    fr.src = 'collision.html'; fr.style.cssText = 'width:10px;height:10px;position:absolute;left:-99px';
    document.body.appendChild(fr);
    await new Promise((resolve) => { fr.onload = resolve; setTimeout(resolve, 3000); });
    const w = fr.contentWindow;
    check(!!w && w.customElements.get('heatpump-flow-card') && w.customElements.get('heatpump-flow-card').hfcOwner === undefined, 'in the collision page the generic name belongs to the other card');
    check(!!w && w.customElements.get('heatpump-hydraulic-card')?.hfcOwner === 'sturmi77', 'in the collision page this card is still available under its own name');
    check(!!w && (w.__warns || []).some((m) => /custom:heatpump-hydraulic-card/.test(m)), 'the console says which name to use');
    check(!!w && w.customCards.length === 1 && w.customCards[0].type === 'heatpump-hydraulic-card' && w.customCards[0].name === 'Heatpump Hydraulic Card', 'the card picker then lists the unique name');
    fr.remove();
  }

  // 18. timeline of the operating mode and the gradient of the heating surface
  {
    const s = setups[0];
    const mk = async (scen, extra = {}, cfg = {}, setup = s) => {
      const k = mount({ ...setup.config, ...cfg }, hassOf(toStates({ ...setup.states(scen), ...extra }), setup.registry || {}, setup.energy, setup)); await wait(25);
      return k;
    };
    const tl = async (setup, extraCfg = {}, hassFn) => {
      const h = hassOf(toStates(setup.states('heat')), setup.registry || {}, setup.energy, setup);
      const c = mount({ ...setup.config, timeline: true, ...extraCfg }, hassFn ? hassFn(h) : h); await wait(60);
      return c;
    };
    let c = await tl(s);
    const box = c.shadowRoot.getElementById('timeline');
    const segs = [...c.shadowRoot.querySelectorAll('#timeline .seg')];
    const kinds = new Set(segs.map((x) => [...x.classList].find((k) => k.startsWith('k-'))));
    check(!!box && !box.hidden && segs.length >= 10, `timeline shows the history (${segs.length} periods)`);
    check(['k-heat', 'k-dhw', 'k-defrost', 'k-idle'].every((k) => kinds.has(k)), `all kinds are drawn (${[...kinds]})`);
    check(parseFloat(segs[0].style.left) === 0 && segs.every((x) => parseFloat(x.style.left) + parseFloat(x.style.width) <= 100.01), 'periods fill the bar from left to right');
    check(/Last 24 hours/.test(box.textContent) && /Heating/.test(box.querySelector('.tl-legend').textContent) && /Hot water/.test(box.querySelector('.tl-legend').textContent) && /Defrost/.test(box.querySelector('.tl-legend').textContent), 'title and legend');
    check([...box.querySelectorAll('.tl-axis span')].map((x) => x.textContent).filter((t) => ['00', '06', '12', '18'].includes(t)).length >= 3, `hour ticks at clock times (${[...box.querySelectorAll('.tl-axis span')].map((x) => x.textContent)})`);
    // tap and arrow keys select a period
    segs[1].dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true }));
    const detail = () => c.shadowRoot.getElementById('tl-detail').textContent;
    check(/Heating · \d\d:\d\d–\d\d:\d\d · /.test(detail()) && /min/.test(detail()), `a tap shows start, end and duration (${detail()})`);
    check(c.shadowRoot.activeElement && c.shadowRoot.activeElement.id === 'tl-bar', 'the bar keeps the focus');
    const before = detail();
    c.shadowRoot.getElementById('tl-bar').dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true, composed: true, cancelable: true }));
    check(detail() !== before && /Defrost/.test(detail()), `ArrowRight selects the next period (${detail()})`);
    c.remove();
    // no option, no timeline; no history, no timeline
    c = mount(setups[1].config, hassOf(toStates(setups[1].states('heat')), {}, setups[1].energy, setups[1])); await wait(30);
    check(!c.shadowRoot.getElementById('timeline'), 'without the option there is no timeline');
    c.remove();
    c = await tl(s, {}, (h) => ({ ...h, callWS: () => Promise.reject(new Error('no history')) }));
    check(c.shadowRoot.getElementById('timeline').hidden === true, 'a failed history query hides the timeline');
    c.remove();
    // full state objects (ISO strings) work as well
    const modeId = Object.keys(toStates(s.states('heat'))).find((k) => /hp1_operating_state$/.test(k));
    const iso = (h) => new Date(Date.now() - h * 3600000).toISOString();
    c = await tl(s, {}, (h) => ({ ...h, callWS: (m) => (m.type === 'history/history_during_period' ? Promise.resolve({ [m.entity_ids[0]]: [{ state: 'STBY', last_updated: iso(30) }, { state: 'CH', last_updated: iso(10) }, { state: 'DHW', last_updated: iso(4) }, { state: 'unavailable', last_updated: iso(2) }, { state: 'CH', last_updated: iso(1) }] }) : h.callWS(m)) }));
    const k2 = [...c.shadowRoot.querySelectorAll('#timeline .seg')].map((x) => [...x.classList].find((k) => k.startsWith('k-')));
    check(k2.join() === 'k-idle,k-heat,k-dhw,k-gap,k-heat' || k2.join() === 'k-heat,k-dhw,k-gap,k-heat', `full state objects are understood (${k2})`);
    c.remove();
    // without a mode entity the compressor and the valve are used
    const hm = setups[5];
    c = await tl(hm);
    const k3 = new Set([...c.shadowRoot.querySelectorAll('#timeline .seg')].map((x) => [...x.classList].find((k) => k.startsWith('k-'))));
    check(!c.shadowRoot.getElementById('timeline').hidden && k3.has('k-heat') && k3.has('k-dhw'), `compressor and valve give heating and hot water (${[...k3]})`);
    c.remove();
    // heating surface: gradient from the flow to the return colour, one colour without a difference
    c = await mk('heat');
    const body = c.shadowRoot.getElementById('p-hc-body');
    check(/url\(["']?#g-hcb["']?\)/.test(body.style.stroke) && /oklch/.test(c.shadowRoot.getElementById('g-hcb-m').getAttribute('stop-color')) && !!c.shadowRoot.getElementById('g-hcb-a').getAttribute('stop-color'), `heating surface fades from flow to return colour (${body.style.stroke})`);
    c.remove();
    c = await mk('heat', { 'sensor.eu08l_hc1_flow_line_temperature': '27.4', 'sensor.eu08l_buff1_actual_low_temperature': '27.4', 'sensor.eu08l_hp1_return_line_temperature': '27.4' });
    check(c.shadowRoot.getElementById('p-hc-body').style.stroke === '', 'one colour when flow and return do not differ');
    c.remove();
    c = await mk('heat', {}, {}, setups[6]);
    check(!!c.shadowRoot.getElementById('g-hcb2-a') && !!c.shadowRoot.getElementById('g-hcb-a'), 'every circuit has its own gradient');
    c.remove();
    const keysOf = (n) => (n.schema ? n.schema.flatMap(keysOf) : [n.name]);
    check(C._formSchema({}).schema.flatMap(keysOf).includes('timeline') && !C._formSchema({}).schema.flatMap(keysOf).includes('timeline_hours') && C._formSchema({ timeline: true }).schema.flatMap(keysOf).includes('timeline_hours'), 'editor offers the timeline and its length');
  }

  log.push(`${checks} checks, ${fails.length} failed`);
  document.getElementById('log').textContent = [...log, ...fails.map((f) => `FAIL ${f}`)].join('\n');
  document.getElementById('result').textContent = fails.length ? 'FAIL' : 'PASS';
  document.title = fails.length ? 'FAIL' : 'PASS';
})().catch((e) => { document.getElementById('result').textContent = 'FAIL'; document.getElementById('log').textContent = String(e && e.stack || e); });
</script>
</body>
</html>
